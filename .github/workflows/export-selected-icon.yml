name: Export selected PWA icon sizes
on:
  push:
    branches: [main]
    paths:
      - icon-192.png
      - .github/workflows/export-selected-icon.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Create installable icons from the selected image
        run: |
          python - <<'PY'
          from PIL import Image
          with Image.open('icon-192.png') as source:
              im=source.convert('RGB')
              im.resize((512,512),Image.Resampling.LANCZOS).save('icon-512.png', optimize=True)
              im.resize((180,180),Image.Resampling.LANCZOS).save('apple-touch-icon.png', optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-512.png apple-touch-icon.png
          git diff --cached --quiet || (git commit -m "Generate PWA icons from selected artwork" && git push)
