name: Remove unwanted white borders from theme icons
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-icon-white-frame.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove-white-frame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image processing dependencies
        run: python3 -m pip install --user Pillow numpy scipy
      - name: Remove exterior white background from twelve original icons
        run: python3 scripts/remove_icon_white_frame.py
      - name: Save corrected PNG icons
        run: |
          git add icons/app-rose-*.png icons/app-navy-*.png icons/app-olive-*.png icons/app-plum-*.png
          if git diff --cached --quiet; then
            echo "Images already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove exterior white frame from all four app icon themes"
          git push
