<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة استيراد ترتيل | الدُّرّ المكنون</title><style>body{margin:0;background:#f8f5ee;color:#30433d;font:16px system-ui}main{max-width:760px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:20px;margin:16px 0;box-shadow:0 2px 14px #0001}input{display:block;margin:12px 0}button{background:#386455;color:white;border:0;padding:12px 20px;border-radius:12px;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{background:#eff5f0;border-radius:12px;padding:12px}small{color:#66776d}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#386455}</style><main><h1>استيراد بيانات ترتيل</h1><p>معاينة محلية فقط: اختاري ملفي الجلسات والأخطاء. لن تُرسَل البيانات إلى أي خادم، ولن تُحفظ في حسابك في هذه النسخة التجريبية.</p><section><label>sessions.json <input id="sessions" type="file" accept=".json,application/json"></label><label>mistakes.json <input id="mistakes" type="file" accept=".json,application/json"></label><button id="run">تحليل الملفات</button></section><section id="output" hidden><h2>نتيجة المعاينة</h2><div id="metrics" class="metrics"></div><h3>تصنيف البيانات</h3><div id="types"></div><p id="mapping"></p><p><strong>لم تُحفظ أية بيانات.</strong> هذه معاينة قبل بناء آلية الدمج.</p></section><p><a href="mushaf.html">الرجوع إلى المصحف</a></p></main><script src="tarteel-import.js"></script><script>const $=id=>document.getElementById(id);$('run').onclick=async()=>{try{if(!$('sessions').files[0]||!$('mistakes').files[0])throw Error('اختاري الملفين أولًا');const [sessions,mistakes,map]=await Promise.all([$('sessions').files[0].text().then(JSON.parse),$('mistakes').files[0].text().then(JSON.parse),fetch('data/mushaf-search.json').then(r=>{if(!r.ok)throw Error('تعذر تحميل فهرس المصحف');return r.json()})]);const output=DurrTarteelImport.ingest(sessions,mistakes,{faceForAyah:(s,a)=>map[s+':'+a]?.[0]});const x=output.summary;$('metrics').replaceChildren();for(const [title,value] of [['الجلسات',x.sessions],['الأخطاء الفريدة',x.errors],['المكررات',x.duplicates],['المرفوضة',x.rejected]]){const div=document.createElement('div');div.className='metric';div.textContent=title+' : '+value.toLocaleString('en-US');$('metrics').append(div)}$('types').replaceChildren();for(const [type,n]of Object.entries(x.byType)){const p=document.createElement('p');p.textContent=type+' : '+n.toLocaleString('en-US');$('types').append(p)}$('mapping').textContent='أخطاء لم تُربط بوجه: '+x.unmapped.toLocaleString('en-US');$('output').hidden=false;}catch(e){alert('تعذر التحليل: '+e.message)}};</script></html>
